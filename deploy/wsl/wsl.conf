# 示例：/etc/wsl.conf
#
# 作用：让 WSL2 启动真正的 systemd 作为 PID 1。上面那个
# wsl-fixed-ip.service 和 Docker 的开机自启（docker.service enabled）
# 都依赖它 —— WSL2 默认不启用 systemd，systemctl 直接报
# "System has not been booted with systemd"。
#
# 安装：把本文件放到 WSL 里的 /etc/wsl.conf，然后在 **Windows 侧**执行
#   wsl --shutdown
# 再重新打开 WSL 才生效。改完用下列命令确认：
#   systemctl is-system-running        # 期望 running 或 degraded
#   systemctl is-enabled docker        # 期望 enabled
#
# 注意：不要整段覆盖已有的 wsl.conf，如果里面还有别的配置
# （automount、interop 等），按节合并。

[user]
default=ubuntu

[boot]
systemd=true
