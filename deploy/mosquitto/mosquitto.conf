# Mosquitto 配置（开发阶段）
#
# 这个文件只做一件事：让 broker 能被**局域网里的 ESP32** 连上。
# 看起来只有两行有效配置，但两行都不能少。

# ── 1. 监听地址必须是 0.0.0.0，不能只监听 127.0.0.1 ──────────────
#
# Mosquitto 2.0 起，**默认只绑定回环地址**（这是有意的安全收紧，
# 防止人装完就无意中把 broker 暴露到网络上）。只绑 127.0.0.1 的表现是：
#   - 在容器里 / 在这台机器上连 localhost:1883 完全正常
#   - ESP32 连 192.168.31.128:1883 一直 TCP 超时
# 而且两边都不会给出任何"监听地址不对"的提示。
#
# 显式写 0.0.0.0 才是"监听所有网卡"。
listener 1883 0.0.0.0

# ── 2. 必须显式允许匿名 ─────────────────────────────────────────
#
# 同一个版本变更里，Mosquitto 2.0 还把匿名访问的默认值从 true 改成了
# **false**。只写 listener 不写这一行的话，连接会被 broker 拒绝，
# 客户端侧看到的是 CONNECTION_REFUSED + return code 5（未授权）。
#
# 开发阶段允许匿名，省去配用户名密码的麻烦。
# 正式部署必须改掉：加 password_file，并把 allow_anonymous 设为 false
# （文档 §39：每个设备使用独立身份，不要共享凭据）。
allow_anonymous true

# ── 3. 日志 ────────────────────────────────────────────────────
#
# 默认日志级别（error）几乎什么都看不到，排"为什么连不上"时很被动。
# all 会把每条 CONNECT / PUBLISH 都打出来，开发阶段正好用；
# 正式部署降回 notice 或 warning，否则日志会长得很快。
log_type all
