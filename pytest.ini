[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers：用了没注册的 marker 直接报错，而不是静默忽略。
# 静默忽略的后果是"以为加了 @pytest.mark.slow 会被跳过"，实际每次都跑。
addopts = -q --strict-markers

# 日志在测试里默认被捕获，失败时才显示。加上下面这行可以让 -s 时看到日志。
log_cli = false
log_cli_level = INFO
