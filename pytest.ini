[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers：用了没注册的 marker 直接报错，而不是静默忽略。
# 静默忽略的后果是"以为加了 @pytest.mark.slow 会被跳过"，实际每次都跑。
#
# --cov 默认打开：覆盖率门槛写在 .coveragerc 的 fail_under 里。
# 不默认打开的话，那个门槛只在"有人记得加 --cov"时才生效——
# 而人会忘。代价是每次跑测试多一两秒，换"覆盖率不会悄悄滑下去"。
# skip-covered 让输出只列出有遗漏的文件，不然 20 多个 100% 的行会把
# 真正要看的那几行挤出屏幕。
addopts = -q --strict-markers --cov=app --cov-report=term-missing:skip-covered

# 日志在测试里默认被捕获，失败时才显示。加上下面这行可以让 -s 时看到日志。
log_cli = false
log_cli_level = INFO
